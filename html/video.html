<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#222"/>
  <title>Video & Credits</title>
  <link rel="icon" href="https://d1yjjnpx0p53s8.cloudfront.net/pp840x830-pad1000x1000f8f8f8.jpg?9oPTJs..erd0K9tiddIL4J9OjiCfetIN" />

  <!-- Main CSS -->
  <link rel="stylesheet" href="../index.css" />

  <!-- Font Awesome (icons for controls) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css" />
</head>
<body>
  <!-- Heading -->
  <div class="container">
    <h1 style="text-align:center; margin-top:20px;">Promotional Video</h1>
  </div>

  <!-- Video Player -->
  <div class="video-player">
    <video id="myVideo" width="800" preload="metadata"></video>

    <!-- Custom Controls -->
    <div class="video-controls">
      <button id="playPauseBtn"><i class="fa fa-play"></i></button>
      <button id="muteBtn"><i class="fa fa-volume-up"></i></button>
      <input type="range" class="video-seek" id="seekBar" min="0" max="100" value="0">
      <span id="currentTime">00:00</span> / <span id="totalTime">00:00</span>
      <input type="range" class="video-volume" id="volumeBar" min="0" max="1" step="0.1" value="1">
      <button id="fullscreenBtn"><i class="fa fa-expand"></i></button>
    </div>
  </div>

  <!-- Return button -->
  <div class="container" style="text-align:center; margin-top:25px;">
    <a href="../index.html" class="return-btn">Return to Main Page</a>
  </div>

  <!-- JS -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const script = document.createElement("script");
      script.src = "../js/video-player.js";
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
